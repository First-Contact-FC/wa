<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Password Change</title>
  <style>
    :root { color-scheme: light dark; }
    body { margin: 0; font-family: system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Arial, sans-serif; display: grid; place-items: center; min-height: 100vh; background: #0b0f1a; color: #e6e9ef; }
    .card { width: 92%; max-width: 460px; background: #11172a; border: 1px solid #242b42; border-radius: 12px; padding: 24px; box-shadow: 0 20px 40px rgba(0,0,0,.35); text-align: center; }
    h1 { font-size: 20px; margin: 0 0 12px; }
    p { color: #aab4cf; }
    .ok { color: #4ade80; }
    .err { color: #ff6d6d; }
    a.btn { display: inline-block; margin-top: 14px; padding: 10px 12px; background: #6d76ff; color: white; text-decoration: none; border-radius: 8px; font-weight: 600; }
  </style>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const p = new URLSearchParams(location.search);
      const status = p.get('status');
      const message = p.get('message');
      const h = document.getElementById('h');
      const t = document.getElementById('t');
      if (status === 'success') {
        h.textContent = 'Password reset successful';
        h.className = 'ok';
        t.textContent = 'You can now sign in with your new password.';
      } else if (status === 'error') {
        h.textContent = 'Password reset failed';
        h.className = 'err';
        t.textContent = message || 'Please try again.';
      } else {
        h.textContent = 'Password reset';
        t.textContent = 'Continue to sign in.';
      }
    });
  </script>
</head>
<body>
  <div class="card">
    <h1 id="h">Password reset</h1>
    <p id="t">Continue to sign in.</p>
    <a class="btn" href="/login">Go to Login</a>
  </div>
</body>
</html>
